<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e1b4b">
<title>Микроэкономика — Тест</title>
<style>
:root {
  --bg: #0f0a1e;
  --bg2: #1e1b4b;
  --bg3: #312e81;
  --card: #1e1b4b;
  --text: #f5f3ff;
  --muted: #a5b4fc;
  --accent: #a78bfa;
  --accent2: #8b5cf6;
  --ok: #22c55e;
  --ok-bg: rgba(34,197,94,.15);
  --bad: #ef4444;
  --bad-bg: rgba(239,68,68,.15);
  --warn: #f59e0b;
  --border: #3730a3;
  --radius: 14px;
  --shadow: 0 8px 30px rgba(0,0,0,.4);
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
[data-theme="light"] {
  --bg: #f5f3ff;
  --bg2: #ede9fe;
  --bg3: #ddd6fe;
  --card: #ffffff;
  --text: #1e1b4b;
  --muted: #6d28d9;
  --accent: #7c3aed;
  --accent2: #6d28d9;
  --ok: #16a34a;
  --ok-bg: rgba(22,163,74,.12);
  --bad: #dc2626;
  --bad-bg: rgba(220,38,38,.12);
  --warn: #d97706;
  --border: #c4b5fd;
  --shadow: 0 8px 30px rgba(0,0,0,.08);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100dvh;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:disabled{opacity:.45;cursor:not-allowed}
.hidden{display:none!important}
.app{max-width:720px;margin:0 auto;padding:16px 16px 40px}
@media(min-width:640px){.app{padding:24px 20px 48px}}
.header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.logo{font-size:1.25rem;font-weight:700;letter-spacing:-.02em}
.logo span{color:var(--accent)}
.header-actions{display:flex;gap:8px;align-items:center}
.icon-btn{width:40px;height:40px;border-radius:10px;background:var(--bg2);border:1px solid var(--border);display:grid;place-items:center;font-size:1.1rem;transition:background .15s}
.icon-btn:hover{background:var(--bg3)}
.menu h1{font-size:clamp(1.4rem,5vw,1.9rem);font-weight:700;margin-bottom:6px}
.menu .sub{color:var(--muted);margin-bottom:22px;font-size:.95rem}
.block-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:18px}
.block-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 12px;display:flex;flex-direction:column;gap:8px;transition:border-color .15s,transform .12s;box-shadow:var(--shadow)}
.block-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.block-card .title{font-weight:600;font-size:.95rem}
.block-card .range{font-size:.8rem;color:var(--muted)}
.block-actions{display:flex;gap:6px}
.btn-sm{flex:1;padding:7px 0;border-radius:8px;font-size:.82rem;font-weight:600;transition:background .15s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2)}
.btn-ghost{background:var(--bg2);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--bg3)}
.quick-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.btn-lg{padding:14px 22px;border-radius:var(--radius);font-weight:600;font-size:.95rem;display:inline-flex;align-items:center;gap:8px;transition:background .15s,transform .12s}
.btn-lg:hover{transform:translateY(-1px)}
.btn-accent{background:var(--accent);color:#fff}
.btn-accent:hover{background:var(--accent2)}
.btn-outline{background:transparent;border:1.5px solid var(--border)}
.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.stats-bar{margin-top:22px;padding:14px 16px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);display:flex;flex-wrap:wrap;gap:16px 24px;font-size:.88rem;color:var(--muted)}
.stats-bar b{color:var(--text)}
.progress-wrap{margin-bottom:16px}
.progress-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:.85rem;color:var(--muted);flex-wrap:wrap;gap:6px}
.progress-bar{height:6px;background:var(--bg2);border-radius:99px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),#c4b5fd);border-radius:99px;transition:width .3s ease}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px 18px;margin-bottom:16px;box-shadow:var(--shadow)}
.q-num{font-size:.8rem;color:var(--muted);margin-bottom:8px;font-weight:500}
.q-text{font-size:1.12rem;font-weight:600;line-height:1.45;margin-bottom:18px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;padding:13px 14px;border-radius:12px;background:var(--bg);border:2px solid var(--border);display:flex;gap:12px;align-items:flex-start;transition:border-color .15s,background .15s,transform .1s;font-size:.95rem}
.opt:hover:not(:disabled){border-color:var(--accent);transform:translateX(2px)}
.opt:disabled{cursor:default}
.opt .letter{flex-shrink:0;width:28px;height:28px;border-radius:8px;background:var(--bg2);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .letter{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .letter{background:var(--bad);color:#fff}
.opt.selected:not(.ok):not(.bad){border-color:var(--accent);background:rgba(167,139,250,.15)}
.feedback{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:.92rem;animation:fadeIn .25s ease}
.feedback.ok{background:var(--ok-bg);border:1px solid var(--ok)}
.feedback.bad{background:var(--bad-bg);border:1px solid var(--bad)}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.nav-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.nav-row .spacer{flex:1}
.btn-nav{padding:11px 18px;border-radius:10px;font-weight:600;font-size:.9rem;background:var(--bg2);border:1px solid var(--border);transition:background .15s}
.btn-nav:hover:not(:disabled){background:var(--bg3)}
.btn-nav.primary{background:var(--accent);color:#fff;border-color:transparent}
.btn-nav.primary:hover:not(:disabled){background:var(--accent2)}
.flag-btn{width:42px;height:42px;border-radius:10px;background:var(--bg2);border:1px solid var(--border);display:grid;place-items:center;font-size:1.15rem}
.flag-btn.active{background:var(--warn);border-color:var(--warn);color:#fff}
.res-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px 20px;text-align:center;box-shadow:var(--shadow);margin-bottom:20px}
.res-score{font-size:3rem;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.res-score.good{color:var(--ok)}.res-score.mid{color:var(--warn)}.res-score.low{color:var(--bad)}
.res-label{color:var(--muted);margin:6px 0 18px;font-size:.95rem}
.res-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.err-list{margin-top:8px}
.err-item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;font-size:.9rem}
.err-item b{display:block;margin-bottom:4px}
.err-item .ans{color:var(--muted);font-size:.85rem;margin-top:4px}
.err-item .correct{color:var(--ok)}
.perfect-badge{display:inline-block;background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok);padding:8px 16px;border-radius:99px;font-weight:700;font-size:.95rem;margin-bottom:12px}
.round-badge{display:inline-flex;align-items:center;gap:6px;background:var(--warn);color:#fff;padding:4px 12px;border-radius:99px;font-size:.8rem;font-weight:600;margin-bottom:10px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--bg3);color:var(--text);padding:12px 20px;border-radius:12px;font-size:.9rem;font-weight:500;box-shadow:var(--shadow);opacity:0;transition:all .3s ease;z-index:100;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:50;padding:16px;animation:fadeIn .2s ease}
.modal{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px 20px;max-width:400px;width:100%;box-shadow:var(--shadow)}
.modal h2{font-size:1.15rem;margin-bottom:10px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);font-size:.92rem}
.settings-row:last-child{border-bottom:none}
.toggle{width:44px;height:26px;border-radius:99px;background:var(--bg3);position:relative;transition:background .2s;cursor:pointer}
.toggle.on{background:var(--accent)}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle.on::after{transform:translateX(18px)}
.kbd-hint{margin-top:18px;text-align:center;font-size:.78rem;color:var(--muted)}
.kbd{display:inline-block;padding:2px 6px;border-radius:5px;background:var(--bg2);border:1px solid var(--border);font-size:.72rem;font-family:monospace;margin:0 2px}
@media(max-width:480px){.block-grid{grid-template-columns:1fr 1fr}.q-text{font-size:1.02rem}.opt{padding:12px}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="header">
    <div class="logo">Микро<span>экономика</span></div>
    <div class="header-actions">
      <button class="icon-btn" id="themeBtn" title="Тема">🌓</button>
      <button class="icon-btn" id="settingsBtn" title="Настройки">⚙️</button>
    </div>
  </header>

  <section id="menu" class="menu">
    <h1>Тест: Микроэкономика</h1>
    <p class="sub">251 вопросов · блоки по 25 · открыт для всех</p>
    <div class="block-grid" id="blockGrid"></div>
    <div class="quick-row">
      <button class="btn-lg btn-accent" id="rndBtn">🔀 Случайные 25</button>
      <button class="btn-lg btn-outline" id="allBtn">📋 Все вопросы</button>
      <button class="btn-lg btn-outline" id="flaggedBtn" style="display:none">🚩 Отмеченные</button>
      <button class="btn-lg btn-outline" id="wrongBtn" style="display:none">❌ Ошибки</button>
    </div>
    <div class="stats-bar">
      <span>Пройдено: <b id="statDone">0</b></span>
      <span>Точность: <b id="statAcc">—</b></span>
      <span>Отмечено: <b id="statFlag">0</b></span>
    </div>
  </section>

  <section id="quiz" class="hidden">
    <div id="roundBadge" class="round-badge hidden">🔄 Повтор ошибок · раунд <span id="roundNum">1</span></div>
    <div class="progress-wrap">
      <div class="progress-meta">
        <span id="cnt">Вопрос 1 из 25</span>
        <span id="scoreLive">Верно: 0</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progFill" style="width:0%"></div></div>
    </div>
    <div class="q-card">
      <div class="q-num" id="qNum"></div>
      <div class="q-text" id="qText"></div>
      <div class="opts" id="opts"></div>
      <div id="fb" class="hidden"></div>
    </div>
    <div class="nav-row">
      <button class="btn-nav" id="prevBtn">← Назад</button>
      <button class="flag-btn" id="flagBtn" title="Отметить">🚩</button>
      <div class="spacer"></div>
      <button class="btn-nav" id="homeBtn">Меню</button>
      <button class="btn-nav primary" id="nextBtn">Далее →</button>
    </div>
    <p class="kbd-hint">Клавиши: <span class="kbd">1</span>–<span class="kbd">4</span> · <span class="kbd">←</span><span class="kbd">→</span> · <span class="kbd">F</span> флаг · <span class="kbd">Enter</span></p>
  </section>

  <section id="res" class="hidden">
    <div class="res-card">
      <div id="perfectBadge" class="perfect-badge hidden">🎉 100% — всё верно!</div>
      <div class="res-score" id="resScore">0%</div>
      <div class="res-label" id="resLabel">Результат</div>
      <p style="margin-bottom:8px;font-size:1.05rem">Верно: <b id="resOk">0</b> из <b id="resTotal">0</b></p>
      <p id="firstTryInfo" style="color:var(--muted);font-size:.9rem;margin-bottom:16px"></p>
      <div class="res-actions" id="resActions"></div>
    </div>
    <div id="errList" class="err-list"></div>
  </section>
</div>
<div class="toast" id="toast"></div>
<script>
const DATA = [{"n":1,"q":"Когда экономические проблемы решаются частично рынком, частично правительством, то это ...","opts":[{"letter":"А","text":"Смешанная экономика"},{"letter":"Б","text":"Натуральная экономика"},{"letter":"В","text":"Рыночная экономика"},{"letter":"Г","text":"Командная экономика"}],"answer":"А","flag":""},{"n":2,"q":"В зависимости от подхода к объяснению поведения отдельных экономических субъектов как подразделяется микроэкономика?","opts":[{"letter":"А","text":"на позитивную и нормативную;"},{"letter":"Б","text":"на негативную и нормативную;"},{"letter":"В","text":"на негативную и позитивную;"},{"letter":"Г","text":"на нормативную и плановую;"}],"answer":"А","flag":""},{"n":3,"q":"Все микроэкономические выборы осуществляются в рамках","opts":[{"letter":"А","text":"двух моделей;"},{"letter":"Б","text":"четырех моделей;"},{"letter":"В","text":"пяти моделей;"},{"letter":"Г","text":"десяти моделей;"}],"answer":"А","flag":""},{"n":4,"q":"Экономические решения в рамках иерархической модели характеризуются тем,","opts":[{"letter":"А","text":"что индивидуальные действия людей, следовательно, и их выборы подчинены указаниям, инструкциям и распоряжениям центральной власти;"},{"letter":"Б","text":"что общие действия людей, следовательно, и их выборы подчинены указаниям, инструкциям и распоряжениям центральной власти;"},{"letter":"В","text":"что действия и выборы индивидуумов приспосабливаются к реальным условиям, основываясь на информации и стимулах своего непосредственного окружения;"},{"letter":"Г","text":"что действия и выборы государств приспосабливаются к реальным условиям, основываясь на информации и стимулах своего непосредственного окружения;"}],"answer":"А","flag":""},{"n":5,"q":"Экономические решения в рамках модели стихийного порядка характеризуются тем,","opts":[{"letter":"А","text":"что действия и выборы индивидуумов приспосабливаются к реальным условиям, основываясь на информации и стимулах своего непосредственного окружения;"},{"letter":"Б" я всех фирм внезапно повысилась величина нормальной прибыли, то в долгосрочном периоде в отрасли","opts":[{"letter":"А","text":"станет меньше фирм и повысится цена продукции"},{"letter":"Б","text":"станет меньше фирм и понизится цена продукции"},{"letter":"В","text":"станет больше фирм и повысится цена продукции"},{"letter":"Г","text":"станет больше фирм и понизится цена продукции"}],"answer":"А","flag":""}];
const LS = {
  get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},
  set(k,v){localStorage.setItem(k,JSON.stringify(v))}
};
let list=[], pos=0, answers={};
let flags=new Set(LS.get('micro_flags',[]));
let history=LS.get('micro_history',{done:0,correct:0});
let settings=LS.get('micro_settings',{shuffleOpts:true,instantFeedback:true,confirmExit:true});
let session={mode:'block',originalList:[],firstTryCorrect:0,firstTryTotal:0,round:1,isRetry:false};
const $=id=>document.getElementById(id);
const show=v=>['menu','quiz','res'].forEach(x=>$(x).classList.toggle('hidden',x!==v));

const theme=LS.get('micro_theme','dark');
document.documentElement.setAttribute('data-theme',theme==='light'?'light':'');
$('themeBtn').onclick=()=>{
  const next=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';
  document.documentElement.setAttribute('data-theme',next==='light'?'light':'');
  LS.set('micro_theme',next);
};

let toastTimer;
function toast(msg){
  const t=$('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}
function updateStats(){
  $('statDone').textContent=history.done;
  $('statAcc').textContent=history.done?Math.round(history.correct/history.done*100)+'%':'—';
  $('statFlag').textContent=flags.size;
  $('flaggedBtn').style.display=flags.size?'':'none';
  $('wrongBtn').style.display=(LS.get('micro_wrongs',[]).length)?'':'none';
}
function buildMenu(){
  const grid=$('blockGrid');grid.innerHTML='';
  const blocks=Math.ceil(DATA.length/25);
  for(let i=1;i<=blocks;i++){
    const start=(i-1)*25+1, end=Math.min(i*25,DATA.length);
    const card=document.createElement('div');
    card.className='block-card';
    card.innerHTML=`<div class="title">Блок ${i}</div><div class="range">${start}–${end}</div>
      <div class="block-actions">
        <button class="btn-sm btn-primary" data-b="${i}">Старт</button>
        <button class="btn-sm btn-ghost" data-s="${i}" title="Перемешать">🔀</button>
      </div>`;
    grid.appendChild(card);
  }
  grid.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>startBlock(+b.dataset.b,false));
  grid.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>startBlock(+b.dataset.s,true));
  updateStats();
}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startBlock(n,shuffled){
  let arr=DATA.filter(q=>q.n>(n-1)*25&&q.n<=n*25);
  if(shuffled) arr=shuffle(arr);
  begin(arr,'block-'+n);
}
function begin(arr,mode,isRetry=false){
  list=arr;pos=0;answers={};
  if(!isRetry) window._qMap={};
  session.mode=mode;session.isRetry=isRetry;
  if(!isRetry){session.originalList=[...arr];session.firstTryCorrect=0;session.firstTryTotal=arr.length;session.round=1}
  else session.round+=1;
  $('roundBadge').classList.toggle('hidden',!isRetry);
  $('roundNum').textContent=session.round;
  show('quiz');render();window.scrollTo(0,0);
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function getMappedAnswer(q){return (window._qMap&&window._qMap[q.n])?window._qMap[q.n].answer:q.answer}
function getMappedOpts(q){return (window._qMap&&window._qMap[q.n])?window._qMap[q.n].opts:q.opts}

function render(){
  const q=list[pos];
  const a=answers[q.n];
  const total=list.length;
  $('cnt').textContent=`Вопрос ${pos+1} из ${total} · №${q.n}`;
  $('qNum').textContent=`Вопрос №${q.n}`;
  $('qText').textContent=q.q;
  $('progFill').style.width=((pos+(a?1:0))/total*100)+'%';
  const answered=Object.keys(answers).length;
  const correct=list.filter(x=>answers[x.n]===getMappedAnswer(x)).length;
  $('scoreLive').textContent=answered?`Верно: ${correct}/${answered}`:'Верно: —';

  const letters=['А','Б','В','Г'];
  if(!window._qMap) window._qMap={};
  if(!window._qMap[q.n]){
    const texts=q.opts.map(o=>o.text);
    const correctText=q.opts.find(o=>o.letter===q.answer).text;
    const shuffled=settings.shuffleOpts?shuffle(texts):texts.slice();
    const mapped=[];
    let correctLetter='А';
    for(let i=0;i<Math.min(4,shuffled.length);i++){
      mapped.push({letter:letters[i],text:shuffled[i]});
      if(shuffled[i]===correctText) correctLetter=letters[i];
    }
    window._qMap[q.n]={opts:mapped,answer:correctLetter};
  }
  const displayOpts=window._qMap[q.n].opts;
  const currentAnswer=window._qMap[q.n].answer;

  $('opts').innerHTML=displayOpts.map(o=>{
    let cls='opt';
    if(a){
      if(o.letter===currentAnswer) cls+=' ok';
      else if(o.letter===a) cls+=' bad';
    } else if(answers[q.n]===o.letter) cls+=' selected';
    return `<button class="${cls}" data-l="${o.letter}" ${a?'disabled':''}>
      <span class="letter">${o.letter}</span><span>${esc(o.text)}</span></button>`;
  }).join('');

  $('opts').querySelectorAll('.opt').forEach(b=>{
    b.onclick=()=>{
      if(answers[q.n]) return;
      answers[q.n]=b.dataset.l;
      if(settings.instantFeedback) render();
      else{$('opts').querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')}
    };
  });

  const fb=$('fb');
  if(a&&settings.instantFeedback){
    const ok=a===currentAnswer;
    const correctText=(displayOpts.find(o=>o.letter===currentAnswer)||{}).text||'';
    fb.className='feedback '+(ok?'ok':'bad');
    fb.innerHTML=`<b>${ok?'✓ Верно':'✗ Неверно'}</b> · Правильный ответ: <b>${currentAnswer}</b> — ${esc(correctText)}`;
    fb.classList.remove('hidden');
  } else {fb.classList.add('hidden');fb.innerHTML=''}

  $('flagBtn').classList.toggle('active',flags.has(q.n));
  $('prevBtn').disabled=pos===0;
  $('nextBtn').textContent=pos===list.length-1?'Завершить':'Далее →';
}

$('prevBtn').onclick=()=>{pos--;render();window.scrollTo(0,0)};
$('nextBtn').onclick=()=>{if(pos<list.length-1){pos++;render();window.scrollTo(0,0)}else finish()};
$('homeBtn').onclick=()=>{
  if(settings.confirmExit&&Object.keys(answers).length){if(!confirm('Выйти в меню?'))return}
  show('menu');updateStats();
};
$('flagBtn').onclick=()=>{
  const n=list[pos].n;
  if(flags.has(n)){flags.delete(n);toast('Флаг снят')}else{flags.add(n);toast('Вопрос отмечен')}
  LS.set('micro_flags',[...flags]);
  $('flagBtn').classList.toggle('active',flags.has(n));updateStats();
};

function finish(){
  const ok=list.filter(q=>answers[q.n]===getMappedAnswer(q)).length;
  const total=list.length;
  const pct=Math.round(ok/total*100);
  const wrongs=list.filter(q=>answers[q.n]!==getMappedAnswer(q));
  if(session.round===1){
    session.firstTryCorrect=ok;session.firstTryTotal=total;
    history.done+=total;history.correct+=ok;LS.set('micro_history',history);
    const prev=LS.get('micro_wrongs',[]);
    LS.set('micro_wrongs',[...new Set([...prev,...wrongs.map(q=>q.n)])]);
  }
  const firstPct=session.firstTryTotal?Math.round(session.firstTryCorrect/session.firstTryTotal*100):pct;
  $('resScore').textContent=pct+'%';
  $('resScore').className='res-score '+(pct>=80?'good':pct>=50?'mid':'low');
  $('resOk').textContent=ok;$('resTotal').textContent=total;
  $('perfectBadge').classList.toggle('hidden',pct!==100);
  if(session.round===1){
    $('resLabel').textContent=pct===100?'Идеально с первого раза!':pct>=80?'Отличный результат':pct>=50?'Неплохо':'Нужно повторить';
    $('firstTryInfo').textContent=`Эффективность с первой попытки: ${firstPct}% (${session.firstTryCorrect} из ${session.firstTryTotal})`;
  } else {
    $('resLabel').textContent=pct===100?`Все ошибки исправлены за ${session.round} раунд(а/ов)!`:`Раунд ${session.round}: ещё есть ошибки`;
    $('firstTryInfo').textContent=`Первая попытка: ${firstPct}% · Сейчас: ${pct}%`;
  }
  const actions=$('resActions');actions.innerHTML='';
  if(wrongs.length){
    const btn=document.createElement('button');
    btn.className='btn-lg btn-accent';
    btn.textContent=`🔄 Исправить ошибки (${wrongs.length})`;
    btn.onclick=()=>begin(wrongs,session.mode,true);
    actions.appendChild(btn);
  } else if(session.round>1){
    const info=document.createElement('p');
    info.style.cssText='width:100%;color:var(--ok);font-weight:600;margin-bottom:8px';
    info.textContent=`✓ Всё правильно. Первая попытка: ${firstPct}%`;
    actions.appendChild(info);
  }
  const again=document.createElement('button');
  again.className='btn-lg btn-outline';again.textContent='Ещё раз (с начала)';
  again.onclick=()=>begin(session.originalList,session.mode,false);
  actions.appendChild(again);
  const menu=document.createElement('button');
  menu.className='btn-lg btn-outline';menu.textContent='В меню';
  menu.onclick=()=>{show('menu');updateStats()};
  actions.appendChild(menu);
  const errBox=$('errList');errBox.innerHTML='';
  if(wrongs.length){
    errBox.innerHTML='<h3 style="margin:0 0 12px;font-size:1rem">Ошибки</h3>';
    wrongs.forEach(q=>{
      const user=answers[q.n]||'пропуск';
      const ans=getMappedAnswer(q);
      const correctText=(getMappedOpts(q).find(o=>o.letter===ans)||{}).text||'';
      const div=document.createElement('div');div.className='err-item';
      div.innerHTML=`<b>№${q.n}. ${esc(q.q)}</b><div class="ans">Ваш ответ: ${user} · <span class="correct">Правильный: ${ans} — ${esc(correctText)}</span></div>`;
      errBox.appendChild(div);
    });
  }
  show('res');window.scrollTo(0,0);updateStats();
}

$('rndBtn').onclick=()=>begin(shuffle(DATA).slice(0,25),'random');
$('allBtn').onclick=()=>{if(confirm('Запустить все '+DATA.length+' вопросов?'))begin([...DATA],'all')};
$('flaggedBtn').onclick=()=>{const arr=DATA.filter(q=>flags.has(q.n));if(!arr.length){toast('Нет отмеченных');return}begin(arr,'flagged')};
$('wrongBtn').onclick=()=>{const ids=LS.get('micro_wrongs',[]);const arr=DATA.filter(q=>ids.includes(q.n));if(!arr.length){toast('Нет ошибок');return}begin(arr,'wrong')};

$('settingsBtn').onclick=()=>{
  const bd=document.createElement('div');bd.className='modal-backdrop';
  bd.innerHTML=`<div class="modal"><h2>Настройки</h2>
    <div class="settings-row"><span>Перемешивать варианты</span><div class="toggle ${settings.shuffleOpts?'on':''}" data-k="shuffleOpts"></div></div>
    <div class="settings-row"><span>Мгновенная проверка</span><div class="toggle ${settings.instantFeedback?'on':''}" data-k="instantFeedback"></div></div>
    <div class="settings-row"><span>Подтверждать выход</span><div class="toggle ${settings.confirmExit?'on':''}" data-k="confirmExit"></div></div>
    <div class="settings-row"><span>Сбросить статистику</span><button class="btn-sm btn-ghost" id="resetStats" style="padding:6px 12px">Сброс</button></div>
    <div class="modal-actions" style="margin-top:16px"><button class="btn-nav primary" id="closeSet">Готово</button></div></div>`;
  document.body.appendChild(bd);
  bd.querySelectorAll('.toggle').forEach(t=>{t.onclick=()=>{const k=t.dataset.k;settings[k]=!settings[k];t.classList.toggle('on',settings[k]);LS.set('micro_settings',settings)}});
  bd.querySelector('#resetStats').onclick=()=>{if(confirm('Сбросить?')){history={done:0,correct:0};LS.set('micro_history',history);LS.set('micro_wrongs',[]);flags=new Set();LS.set('micro_flags',[]);updateStats();toast('Сброшено')}};
  bd.querySelector('#closeSet').onclick=()=>bd.remove();
  bd.onclick=e=>{if(e.target===bd)bd.remove()};
};

document.addEventListener('keydown',e=>{
  if($('quiz').classList.contains('hidden'))return;
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  const q=list[pos];if(!q)return;
  if(['1','2','3','4'].includes(e.key)&&!answers[q.n]){
    const map={'1':'А','2':'Б','3':'В','4':'Г'};
    if(q.opts.some(o=>o.letter===map[e.key])||true){answers[q.n]=map[e.key];render()}
  }
  if(e.key==='ArrowRight'||e.key==='Enter'){e.preventDefault();$('nextBtn').click()}
  if(e.key==='ArrowLeft'){e.preventDefault();$('prevBtn').click()}
  if(e.key==='f'||e.key==='F'||e.key==='а'||e.key==='А'){$('flagBtn').click()}
});
buildMenu();
</script>
</body>
</html>
